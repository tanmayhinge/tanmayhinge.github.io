<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/circle_favicon.png">
<link rel="apple-touch-icon" sizes="192x192" href="/circle_favicon.png">

<!-- matches --bg. Light is the default for everyone, so that is what ships in
     the markup; theme.js repoints it at the dark --bg when dark is chosen. -->
<meta name="theme-color" content="#EAEDF2" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Girassol&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="/styles.css?v=51" />

<!-- stamp a previously chosen theme before first paint; blocking on purpose.
     Nothing stored means light: the stylesheet already defaults there. -->
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<script src="/theme.js?v=3" defer></script>
